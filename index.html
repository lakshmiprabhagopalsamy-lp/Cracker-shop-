<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sri Jayalakshmi Crackers - Place Order</title>
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1610;--card:#2a2018;--ink:#f6ead9;--mut:#bba58a;--acc:#ff8a4c;--line:#4a3a2b}}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
label{font-size:13px;color:var(--mut);display:block;margin:8px 0 3px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:var(--bg);color:var(--ink)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:540px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--mut);text-transform:uppercase}
td.n,th.n{text-align:right}
tr.sec td{background:var(--bg);color:var(--acc);font-weight:700;font-size:13px}
.q{width:70px;text-align:center;padding:7px}

.sum .disc{color:#2b8a3e}.sum .tot{font-size:20px;font-weight:700;border-top:2px solid var(--acc);margin-top:4px;padding-top:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{flex:1;min-width:160px;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
button.alt{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.wa{background:#25a244}
.err{color:#c92a2a;font-size:14px;min-height:18px;margin:6px 0}
#bill{display:none;--card:#fff;--ink:#222;--mut:#555;--line:#bbb;background:#fff;color:#222;padding:18px}
#bill h2{margin:0;color:var(--acc)}#bill .meta{font-size:13px;color:#555;margin-top:2px}
#bill table{border:1px solid #aaa;margin-top:12px;min-width:0;width:100%}
@media (max-width:600px){#bill{padding:10px}#bill h2{font-size:20px}#bill th,#bill td{padding:6px 4px;font-size:12px}#bill th{font-size:10px}#bill .t div{gap:10px;font-size:14px}#bill .t div b{min-width:84px}}
#bill th,#bill td{border:1px solid #bbb;padding:8px 7px;color:#222}
#bill th{background:#f4f4f4;font-size:11px;color:#444}
#bill .t div{display:flex;justify-content:flex-end;gap:30px;padding:5px 4px;font-size:15px}
#bill .t div b{min-width:110px;text-align:right;font-family:ui-monospace,Consolas,monospace}
#bill .t .g{border-top:1px solid #888;margin-top:6px;padding-top:10px;font-weight:700;font-size:17px}
#bill .ft{border-top:1px solid #888;margin-top:16px;padding-top:10px;text-align:center;font-size:13px;color:#333;line-height:1.6}
.billcopy{--card:#fff;--ink:#222;--mut:#555;--line:#bbb;background:#fff;color:#222;padding:18px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.billcopy h2{margin:0;color:var(--acc)}.billcopy .meta{font-size:13px;color:#555;margin-top:2px}
.billcopy table{border:1px solid #aaa;margin-top:12px;min-width:0;width:100%}
.billcopy th,.billcopy td{border:1px solid #bbb;padding:8px 7px;color:#222}
.billcopy th{background:#f4f4f4;font-size:11px;color:#444}
.billcopy .t div{display:flex;justify-content:flex-end;gap:30px;padding:5px 4px;font-size:15px}
.billcopy .t div b{min-width:110px;text-align:right;font-family:ui-monospace,Consolas,monospace}
.billcopy .t .g{border-top:1px solid #888;margin-top:6px;padding-top:10px;font-weight:700;font-size:17px}
.billcopy .ft{border-top:1px solid #888;margin-top:16px;padding-top:10px;text-align:center;font-size:13px;color:#333;line-height:1.6}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}#bill{display:block!important;border:0}}
</style></head>
<body><div class="wrap">

<div id="bill"></div>

<script>

#GIFT BOX - NET RATE (NO DISCOUNT)
139|45 Items Gift Box (NET)||650|N

/* =============================== */
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const ITEMS=[],tb=$("rows");
DATA.split("\n").forEach(l=>{
  if(l[0]==="#"){const tr=document.createElement("tr");tr.className="sec";tr.innerHTML=`<td colspan="6">${l.slice(1)}</td>`;tb.appendChild(tr);return}
  const p=l.split("|"),i=ITEMS.length;
  ITEMS.push({no:+p[0],name:p[1],per:p[2]||"Box",rate:+p[3],net:p[4]==="N"});
  const tr=document.createElement("tr");tr.dataset.s=(p[0]+" "+p[1]).toLowerCase();
  tr.innerHTML=`<td>${p[0]}</td><td>${p[1]}</td><td>${p[2]||"Box"}</td><td class="n">${fmt(+p[3])}</td>
  <td><input class="q" type="number" min="0" inputmode="numeric" data-i="${i}" placeholder="0"></td><td class="n" id="t${i}">0.00</td>`;
  tb.appendChild(tr);
});
function calc(){
  let ds=0,nt=0;
  document.querySelectorAll(".q").forEach(q=>{
    const it=ITEMS[+q.dataset.i],n=Math.max(0,parseInt(q.value)||0),t=n*it.rate;
    $("t"+q.dataset.i).textContent=fmt(t);
    if(it.net)nt+=t;else ds+=t;
  });
  const d=ds*DISCOUNT/100,dt=ds-d;
  $("sub").textContent=fmt(ds);$("disc").textContent="-"+fmt(d);$("dt").textContent=fmt(dt);$("net").textContent=fmt(nt);$("grand").textContent="₹"+fmt(dt+nt);
  return {ds,d,dt,nt,grand:dt+nt};
}
tb.addEventListener("input",calc);
$("search").addEventListener("input",e=>{
  const s=e.target.value.trim().toLowerCase();
  tb.querySelectorAll("tr").forEach(tr=>{
    if(tr.className==="sec")tr.style.display=s?"none":"";
    else tr.style.display=(!s||tr.dataset.s.includes(s))?"":"none";
  });
});
let order=null;
$("gen").onclick=()=>{
  const name=$("cname").value.trim(),ph=$("cphone").value.trim(),lines=[];
  document.querySelectorAll(".q").forEach(q=>{const n=parseInt(q.value)||0;if(n>0){const it=ITEMS[+q.dataset.i];lines.push({...it,qty:n,amt:n*it.rate});}});
  if(!name){$("err").textContent="Please enter your name.";return}
  if(ph.replace(/\D/g,"").length<10){$("err").textContent="Please enter a valid mobile number.";return}
  if(!$("caddr").value.trim()){$("err").textContent="Please enter delivery address.";return}
  if(!lines.length){$("err").textContent="Please enter quantity for at least one item.";return}
  $("err").textContent="";
  const tot=calc(),now=new Date();
  const no="SJC"+now.getFullYear().toString().slice(2)+String(now.getMonth()+1).padStart(2,"0")+String(now.getDate()).padStart(2,"0")+"-"+Math.floor(1000+Math.random()*9000);
  const addr=$("caddr").value.trim().replace(/</g,"&lt;"),nm=name.replace(/</g,"&lt;");
  order={no,name,ph};pdfFile=null;$("share").style.display="none";$("hint").textContent="";
  $("bill").innerHTML=`<h2>Sri Jayalakshmi Crackers</h2><div style="display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:13px;line-height:1.7;color:#333">
  <div style="min-width:0;flex:1"><div>Customer Name: <b>${nm}</b></div><div>Mobile Number: <b>${ph.replace(/</g,"")}</b></div><div>Delivery Address: <b>${addr}</b></div></div>
  <div style="text-align:right;white-space:nowrap"><div>DATE: <b>${now.toLocaleDateString("en-IN")}</b></div><div>TIME: <b>${now.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}</b></div></div></div>
  <table><thead><tr><th>S.NO</th><th>PRODUCT NAME</th><th>PER</th><th class="n">RATE</th><th class="n">QUANTITY / REQUIREMENT</th><th class="n">AMOUNT</th></tr></thead><tbody>
  ${lines.map((l,k)=>`<tr><td>${k+1}</td><td>${l.name}</td><td>${l.per}</td><td class="n">${fmt(l.rate)}</td><td class="n">${l.qty}</td><td class="n">${fmt(l.amt)}</td></tr>`).join("")}
  </tbody></table>
  <div class="t" style="margin-top:10px">
  ${tot.ds>0?`<div><span>Discountable Sub Total</span><b>${fmt(tot.ds)}</b></div><div><span>Discount (${DISCOUNT}%)</span><b>-${fmt(tot.d)}</b></div><div><span>Discounted Total</span><b>${fmt(tot.dt)}</b></div>`:""}
  ${tot.nt>0?`<div><span>${tot.ds>0?"+ ":""}Net Rate Items (no discount)</span><b>${fmt(tot.nt)}</b></div>`:""}
  <div class="g"><span>Grand Total</span><b>${fmt(tot.grand)}</b></div></div>
  <div class="ft">${ADDRESS}<br>${PHONES}</div>`;
  $("bill").style.display="block";$("after").style.display="flex";
  $("bill").scrollIntoView({behavior:"smooth"});
};
let pdfFile=null;
$("pdf").onclick=async()=>{
  if(!order)return;
  const hint=$("hint");hint.textContent="Creating PDF...";
  try{
    const host=document.createElement("div");
    host.style.cssText="position:fixed;left:-10000px;top:0;width:760px;background:#fff";
    const copy=$("bill").cloneNode(true);copy.style.width="760px";copy.style.display="block";copy.removeAttribute("id");copy.className="billcopy";
    host.appendChild(copy);document.body.appendChild(host);
    const canvas=await html2canvas(copy,{backgroundColor:"#ffffff",scale:2,windowWidth:900});
    host.remove();
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
    const M=10,iw=190,pxPer=canvas.width/iw,sliceH=Math.floor(277*pxPer);
    for(let y=0,pg=0;y<canvas.height;y+=sliceH,pg++){
      const h=Math.min(sliceH,canvas.height-y),c=document.createElement("canvas");
      c.width=canvas.width;c.height=h;
      c.getContext("2d").drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(pg>0)pdf.addPage();
      pdf.addImage(c.toDataURL("image/jpeg",0.95),"JPEG",M,M,iw,h/pxPer);
    }
    const blob=pdf.output("blob");
    pdfFile=new File([blob],"Bill-"+order.no+".pdf",{type:"application/pdf"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=pdfFile.name;document.body.appendChild(a);a.click();a.remove();
    hint.textContent="PDF bill is ready and saved. Now tap Share PDF to Owner.";
    $("share").style.display="";
  }catch(e){hint.textContent="Could not create the PDF. Please try again.";}
};
$("share").onclick=async()=>{
  if(!pdfFile)return;
  if(navigator.canShare&&navigator.canShare({files:[pdfFile]})){
    try{await navigator.share({files:[pdfFile],title:"Order bill"});return}
    catch(e){if(e&&e.name==="AbortError")return}
  }
  $("hint").textContent="WhatsApp is opening. Tap 📎, attach the saved PDF bill and send.";
  setTimeout(()=>window.open("https://wa.me/"+OWNER_WHATSAPP,"_blank"),800);
};
</script></body></html>
